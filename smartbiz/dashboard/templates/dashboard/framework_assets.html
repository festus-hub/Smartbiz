<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<script>
    tailwind = {
        config: {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Roboto", "ui-sans-serif", "system-ui", "sans-serif"]
                    }
                }
            },
            corePlugins: {
                preflight: false
            }
        }
    };
</script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    :root {
        --sb-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --sb-fast: 160ms;
        --sb-normal: 260ms;
        --sb-lift-shadow: 0 16px 36px rgba(15, 23, 42, 0.14);
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow-x: hidden;
    }

    a,
    button,
    .btn,
    .nav-link,
    .menu a,
    .logout-btn,
    .form-control,
    .form-select,
    .dropdown-item {
        transition:
            color var(--sb-fast) var(--sb-ease),
            background-color var(--sb-fast) var(--sb-ease),
            border-color var(--sb-fast) var(--sb-ease),
            box-shadow var(--sb-normal) var(--sb-ease),
            transform var(--sb-normal) var(--sb-ease);
    }

    .btn,
    button,
    .menu a,
    .nav-link {
        will-change: transform;
    }

    .btn:hover,
    .btn:focus-visible,
    button:hover,
    button:focus-visible {
        transform: translateY(-2px);
    }

    .btn:active,
    button:active {
        transform: translateY(0) scale(0.98);
    }

    .form-control:focus,
    .form-select:focus {
        transform: translateY(-1px);
        box-shadow: 0 0 0 0.22rem rgba(37, 99, 235, 0.14);
    }

    .card,
    .panel,
    .summary-card,
    .metric-card,
    .hero-card,
    .insight-card,
    .table-panel,
    .feature-card,
    .showcase-card,
    .contact-card,
    .trust-card,
    .quick-view-card,
    .expense-card,
    .total-card {
        transition:
            transform var(--sb-normal) var(--sb-ease),
            box-shadow var(--sb-normal) var(--sb-ease),
            border-color var(--sb-normal) var(--sb-ease);
    }

    .card:hover,
    .panel:hover,
    .summary-card:hover,
    .metric-card:hover,
    .hero-card:hover,
    .insight-card:hover,
    .table-panel:hover,
    .feature-card:hover,
    .showcase-card:hover,
    .contact-card:hover,
    .trust-card:hover,
    .quick-view-card:hover,
    .expense-card:hover,
    .total-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--sb-lift-shadow);
    }

    .table tbody tr {
        transition:
            background-color var(--sb-fast) var(--sb-ease),
            box-shadow var(--sb-normal) var(--sb-ease),
            transform var(--sb-normal) var(--sb-ease);
    }

    .table tbody tr:hover {
        background-color: rgba(37, 99, 235, 0.045);
    }

    .table-responsive {
        border-radius: 18px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: #fff;
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.06);
    }

    .table {
        --bs-table-bg: transparent;
        margin-bottom: 0;
        color: #1e293b;
    }

    .table thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 0.95rem 1rem;
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        background: #f8fafc;
        color: #64748b;
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
    }

    .table tbody td {
        padding: 1rem;
        border-color: rgba(148, 163, 184, 0.13);
        vertical-align: middle;
    }

    .table tbody tr:last-child td {
        border-bottom-width: 0;
    }

    .table .amount,
    td.amount {
        color: #1d4ed8;
        font-weight: 800;
        white-space: nowrap;
    }

    .empty-state,
    .table td[colspan] {
        color: #64748b;
        font-weight: 700;
        text-align: center;
    }

    .menu a:hover,
    .menu a:focus-visible,
    .nav-link:hover,
    .nav-link:focus-visible,
    .dropdown-item:hover,
    .dropdown-item:focus {
        transform: translateX(3px);
    }

    .navbar-collapse.collapse {
        visibility: visible;
    }

    .navbar-collapse {
        transition:
            height var(--sb-normal) var(--sb-ease),
            opacity var(--sb-normal) var(--sb-ease),
            transform var(--sb-normal) var(--sb-ease);
    }

    .navbar-collapse.collapsing,
    .navbar-collapse.show {
        opacity: 1;
        transform: translateY(0);
    }

    .dropdown-menu {
        display: block;
        pointer-events: none;
        opacity: 0;
        transform: translateY(8px);
        transition:
            opacity var(--sb-fast) var(--sb-ease),
            transform var(--sb-normal) var(--sb-ease),
            visibility var(--sb-fast) var(--sb-ease);
        visibility: hidden;
    }

    .dropdown-menu.show,
    .dropdown:hover > .dropdown-menu,
    .dropdown:focus-within > .dropdown-menu {
        pointer-events: auto;
        opacity: 1;
        transform: translateY(0);
        visibility: visible;
    }

    
    .sb-loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: grid;
        place-items: center;
        pointer-events: none;
        background: rgba(248, 250, 252, 0.56);
        opacity: 0;
        transition: opacity var(--sb-normal) var(--sb-ease);
    }

    .sb-loading-overlay.is-visible {
        opacity: 1;
    }

    .sb-loading-box {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.9rem 1.1rem;
        border-radius: 999px;
        background: #0f172a;
        color: #fff;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.22);
        font-weight: 700;
    }

    @media (max-width: 767.98px) {
        .table-responsive {
            overflow: visible;
            border: 0;
            box-shadow: none;
            background: transparent;
        }

        .table-responsive .table {
            display: block;
        }

        .table-responsive .table thead {
            display: none;
        }

        .table-responsive .table tbody {
            display: grid;
            gap: 0.85rem;
        }

        .table-responsive .table tr {
            display: block;
            padding: 0.35rem 0;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.07);
            overflow: hidden;
        }

        .table-responsive .table tbody tr:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.1);
        }

        .table-responsive .table td {
            display: grid;
            grid-template-columns: minmax(7rem, 42%) 1fr;
            gap: 0.75rem;
            align-items: center;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.13);
            text-align: right;
            word-break: break-word;
        }

        .table-responsive .table td::before {
            content: attr(data-label);
            color: #64748b;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-align: left;
            text-transform: uppercase;
        }

        .table-responsive .table td:last-child {
            border-bottom: 0;
        }

        .table-responsive .table td[colspan] {
            display: block;
            text-align: center;
        }

        .table-responsive .table td[colspan]::before {
            content: "";
        }
    }

    @keyframes sbFadeUp {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

</style>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        document.body.classList.add("sb-page-enter");

        const overlay = document.createElement("div");
        overlay.className = "sb-loading-overlay";
        overlay.setAttribute("aria-hidden", "true");
        overlay.innerHTML = `
            <div class="sb-loading-box">
                <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                <span>Processing...</span>
            </div>
        `;
        document.body.appendChild(overlay);

        const showLoading = (form) => {
            const submitter = form.querySelector("button[type='submit'], input[type='submit']");
            form.setAttribute("aria-busy", "true");

            if (submitter && !submitter.dataset.originalHtml) {
                submitter.dataset.originalHtml = submitter.innerHTML || submitter.value || "";
                submitter.disabled = true;

                if (submitter.tagName === "BUTTON") {
                    submitter.innerHTML = `<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Processing...`;
                } else {
                    submitter.value = "Processing...";
                }
            }

            overlay.classList.add("is-visible");
        };

        document.querySelectorAll("form").forEach((form) => {
            form.addEventListener("submit", (event) => {
                window.setTimeout(() => {
                    const method = (form.getAttribute("method") || "get").toLowerCase();

                    if (
                        event.defaultPrevented ||
                        method === "get" ||
                        form.dataset.noLoading === "true" ||
                        form.target === "_blank"
                    ) {
                        return;
                    }

                    showLoading(form);
                }, 0);
            });
        });

        document.querySelectorAll(".table-responsive table").forEach((table) => {
            const headers = Array.from(table.querySelectorAll("thead th")).map((header) =>
                header.textContent.trim()
            );

            table.querySelectorAll("tbody tr").forEach((row) => {
                Array.from(row.children).forEach((cell, index) => {
                    if (!cell.hasAttribute("data-label") && !cell.hasAttribute("colspan")) {
                        cell.setAttribute("data-label", headers[index] || "");
                    }
                });
            });
        });
    });
</script>
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
