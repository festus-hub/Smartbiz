{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartBiz</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100">

    <div class="min-h-screen flex flex-col lg:flex-row">

        <!-- LEFT SECTION -->
        <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-violet-600 to-purple-800 items-center justify-center relative overflow-hidden w-64,flex-none">

            <div class="absolute inset-0 bg-black/10"></div>

            <div class="relative z-10 text-center text-white px-10">

                <img src="{% static 'images/logo2.png' %}" 
                     alt="SmartBiz Logo"
                     class="w-28 mx-auto mb-6 drop-shadow-lg">

                <h1 class="text-6xl font-bold mb-4">
                    SmartBiz
                </h1>

                <p class="text-lg text-purple-100 max-w-md mx-auto leading-relaxed">
                    Manage your business smarter.
                </p>

            </div>
        </div>

        <!-- RIGHT SECTION -->
        <div class=" lg:w-1/2 flex-1 justify-center p-6 sm:p-10">

            <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 sm:p-10">

                <!-- Mobile Logo -->
                <div class="lg:hidden text-center mb-8">
                    <img src="{% static 'images/logo2.png' %}" 
                         alt="SmartBiz Logo"
                         class="w-20 mx-auto mb-3">

                    <h1 class="text-3xl font-bold text-gray-800">
                        SmartBiz
                    </h1>
                </div>

                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-gray-800">
                        Welcome Back to SmartBiz!
                    </h2>

                    <p class="text-gray-500 mt-2">
                        Login to continue managing your business
                    </p>
                </div>

                <form method="POST" class="space-y-5">
                    {% csrf_token %}

                    <!-- Username -->
                    <div>
                        <label for="username"
                               class="block text-sm font-semibold text-gray-700 mb-2">
                            Username or Email
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-violet-500 transition duration-200"
                        >
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password"
                               class="block text-sm font-semibold text-gray-700 mb-2">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-violet-500 transition duration-200"
                        >
                    </div>

                    <!-- Options -->
                    <div class="flex items-center justify-between text-sm">

                        <label class="flex items-center gap-2 text-gray-600 cursor-pointer">
                            <input
                                type="checkbox"
                                onclick="togglePassword()"
                                class="rounded text-violet-600 focus:ring-violet-500"
                            >
                            Show Password
                        </label>

                        <a href="{% url 'password_reset' %}"
                           class="text-violet-600 hover:text-red-500 font-medium transition">
                            Forgot Password?
                        </a>

                    </div>

                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="w-full bg-violet-600 hover:bg-indigo-600 text-white py-3 rounded-md font-semibold shadow-lg hover:shadow-xl transition duration-300 "
                    >
                        Login
                    </button>
                </form>

                <!-- Divider -->
                <div class="flex items-center my-8">
                    <div class="flex-1 h-px bg-gray-200"></div>
                    <span class="px-4 text-sm text-gray-400">
                        OR
                    </span>
                    <div class="flex-1 h-px bg-gray-200"></div>
                </div>

                <!-- Register -->
                <p class="text-center text-gray-600">
                    Don’t have an account?
                    <a href="{% url 'register' %}"
                       class="text-violet-600 font-semibold hover:text-violet-800 transition">
                        Register
                    </a>
                </p>

            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordField = document.getElementById("password");

            if (passwordField.type === "password") {
                passwordField.type = "text";
            } else {
                passwordField.type = "password";
            }
        }
    </script>

</body>
</html>
