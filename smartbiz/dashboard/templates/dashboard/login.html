{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SmartBiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family:'Poppins',sans-serif; background:linear-gradient(135deg,#e7e8eb,#d7d9dd); }
    .hero-glow::before {
      content:""; position:absolute; inset:0;
      background:radial-gradient(circle at top right,rgba(239, 237, 237, 0.12),transparent 30%);
    }
    .auth-input:focus { outline:none; border-color:#8b5cf6; box-shadow:0 0 0 .2rem rgba(139,92,246,.14); }
  </style>
</head>

<body class="m-0 overflow-x-hidden min-h-screen">

  <div class="flex min-h-screen">

    <section class="hero-glow hidden lg:flex flex-1 relative overflow-hidden items-center justify-center p-8"
             style="background:linear-gradient(135deg,rgba(139,92,246,.96),rgba(76,29,149,.96))">
      <div class="relative z-10 text-center text-white max-w-xl">
        <img src="{% static 'images/logo2.png' %}" alt="SmartBiz Logo"
             class="w-24 h-24 object-cover rounded-[20px] shadow-2xl mx-auto mb-4">
        <h1 class="font-extrabold tracking-[-0.04em] mt-4 mb-3" style="font-size:clamp(2.6rem,5vw,4.6rem)">
          SmartBiz
        </h1>
        <p class="m-0 text-[rgba(243,232,255,.92)] text-[1.05rem] leading-[1.7]">
          Manage your business smarter with sales, customers, payments, and reports in one clean dashboard.
        </p>
      </div>
    </section>

    <section class="flex flex-1 items-center justify-center min-h-screen"
             style="padding:clamp(1rem,4vw,2.5rem)">
      <div class="w-full max-w-[480px] bg-white/97 rounded-[28px] shadow-[0_28px_80px_rgba(15,23,42,.24)]"
           style="padding:clamp(1.5rem,4vw,2.5rem)">

        <div class="lg:hidden text-center mb-6">
          <img src="{% static 'images/logo2.png' %}" alt="SmartBiz Logo"
               class="w-[84px] h-[84px] object-cover rounded-[20px] shadow-[0_16px_36px_rgba(15,23,42,.18)] mx-auto">
          <h1 class="mt-3 mb-0 font-extrabold text-[#0f172a] tracking-[-0.03em]"
              style="font-size:clamp(1.9rem,3.8vw,2.4rem)">SmartBiz</h1>
        </div>

        <div class="mb-6">
          <h2 class="font-extrabold text-[#0f172a] leading-tight tracking-[-0.03em] mb-2"
              style="font-size:clamp(1.9rem,3.8vw,2.4rem)">Welcome back</h2>
          <p class="text-[black] leading-[1.7] m-0">Log in to continue managing your business.</p>
        </div>

        <form method="POST" class="space-y-4">
          {% csrf_token %}

          <div>
            <label for="username" class="block text-sm font-semibold text-black-700 mb-2">Username or Email</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required
                   class="auth-input w-full px-4 py-3.5 border border-[#d1d5db] rounded-2xl text-[.98rem] transition">
          </div>

          <div>
            <label for="password" class="block text-sm font-semibold text-black-700 mb-2">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required
                   class="auth-input w-full px-4 py-3.5 border border-[#d1d5db] rounded-2xl text-[.98rem] transition">
          </div>

          <div class="flex flex-wrap gap-3 justify-between items-center text-sm">
            <label class="inline-flex items-center gap-2 text-black-500 cursor-pointer select-none">
              <input type="checkbox" onclick="togglePassword()" class="rounded accent-violet-600 cursor-pointer ">
              Show password
            </label>
            <a href="{% url 'password_reset' %}" class="text-black-700 font-semibold no-underline hover:text-violet-900 transition-colors">
              Forgot password?
            </a>
          </div>

          <button type="submit"
                  class="block w-full py-3 text-center rounded-2xl font-semibold border border-blue-500 text-blue-600
                  no-underline hover:bg-green-500 transition-colors ">
            Login
          </button>
        </form>

        <div class="flex items-center my-5">
          <div class="flex-1 border-t border-black-200"></div>
          <span class="px-3 text-xs uppercase text-black-400 font-semibold">or</span>
          <div class="flex-1 border-t border-black-200"></div>
        </div>

        <p class="text-center text-black-700 text-sm m-0">
          Don't have an account?
          <a href="{% url 'register' %}" class="text-violet-700 font-semibold no-underline hover:text-violet-900 transition-colors">
            Register
          </a>
        </p>

      </div>
    </section>

  </div>

  <script>
    function togglePassword() {
      const pw = document.getElementById("password");
      pw.type = pw.type === "password" ? "text" : "password";
    }
  </script>
</body>
</html>
