<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - SmartBiz</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 420px;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin-bottom: 12px;
            color: #111827;
        }

        p {
            color: #4b5563;
            line-height: 1.6;
            font-size: 14px;
        }

        form p {
            margin: 0 0 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #4338ca;
        }

        .errorlist {
            color: #b91c1c;
            padding-left: 18px;
            font-size: 14px;
        }

        a {
            color: #4f46e5;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        {% if validlink %}
            <h2>Set a new password</h2>
            <p>Enter your new password twice so we can verify it.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Update Password</button>
            </form>
        {% else %}
            <h2>Reset link invalid</h2>
            <p>This password reset link is invalid or has already been used. Request a new one to continue.</p>
            <a href="{% url 'password_reset' %}">Request another reset link</a>
        {% endif %}
    </div>
</body>
</html>
