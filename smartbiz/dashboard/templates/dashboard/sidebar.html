{% load static %}

<div class="sidebar">
    <div class="logo d-flex align-items-center gap-3">
        <img src="{% static 'images/logo2.png' %}" alt="SmartBiz logo" style="height: 42px; width: 42px; border-radius: 12px; object-fit: cover;">
        <div>
            <div style="font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: #94a3b8;">SmartBiz</div>
            <div style="font-size: 1.2rem; font-weight: 700; color: #ffffff;">Workspace</div>
        </div>
    </div>

    <ul class="menu">
        <li class="section">Overview</li>
        <li>
            <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                Dashboard
            </a>
        </li>
        <li>
            <a href="{% url 'customers' %}" class="{% if request.resolver_match.url_name == 'customers' %}active{% endif %}">
                Customers
            </a>
        </li>
        <li>
            <a href="{% url 'product_list' %}" class="{% if request.resolver_match.url_name == 'product_list' %}active{% endif %}">
                Products
            </a>
        </li>
        <li>
            <a href="{% url 'Stock_movement' %}" class="{% if request.resolver_match.url_name == 'Stock_movement' %}active{% endif %}">
                Stock Movement
            </a>
        </li>

        <li class="section">Sales</li>
        <li>
            <a href="{% url 'sales' %}" class="{% if request.resolver_match.url_name == 'sales' %}active{% endif %}">
                Sales
            </a>
        </li>
        <li>
            <a href="{% url 'add_sale' %}" class="{% if request.resolver_match.url_name == 'add_sale' %}active{% endif %}">
                Add Sale
            </a>
        </li>

        <li class="section">Finance</li>
        <li>
            <a href="{% url 'payments' %}" class="{% if request.resolver_match.url_name == 'payments' %}active{% endif %}">
                Payments
            </a>
        </li>
        <li>
            <a href="{% url 'add_expense' %}" class="{% if request.resolver_match.url_name == 'add_expense' %}active{% endif %}">
                Add Expense
            </a>
        </li>
        <li>
            <a href="{% url 'reports' %}" class="{% if request.resolver_match.url_name == 'reports' %}active{% endif %}">
                Reports
            </a>
        </li>

        <li class="section">Account</li>
        <li>
            <form action="{% url 'logout' %}" method="POST" style="margin: 0;">
                {% csrf_token %}
                <button
                    type="submit"
                    style="width: 100%; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; background: #f59e0b; color: #111827; font-weight: 700;">
                    Logout
                </button>
            </form>
        </li>
    </ul>
</div>
