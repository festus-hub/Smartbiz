{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - SmartBiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <script>
    tailwind = {
      config: {
        theme: { extend: { fontFamily: { sans: ["Inter","ui-sans-serif","system-ui","sans-serif"] } } }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg,#0f172a,#1e293b); }
    .email-field { display:block; width:100%; padding:0.9rem 1rem; margin-top:0.75rem;
      border:1px solid #d1d5db; border-radius:12px; box-sizing:border-box;
      font:inherit; font-size:1rem; color:#111827; }
    .email-field:focus { outline:none; border-color:#4f46e5; box-shadow:0 0 0 10px rgba(79,70,229,.14); }
  </style>
</head>

<body class="font-sans m-0 min-h-screen p-4 grid place-items-center overflow-x-hidden">

  <div class="w-full max-w-[420px] bg-white rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,.2)]"
       style="padding:clamp(1.5rem,4vw,2.5rem)">

    <div class="text-5xl text-indigo-500 mb-4 leading-none text-center">
      <i class="bi bi-shield-lock-fill"></i>
    </div>

    <h2 class="m-0 mb-2 font-bold text-[#111827]" style="font-size:clamp(1.6rem,4vw,2rem)">
      Reset Password
    </h2>
    <p class="text-[#6b7280] text-[0.95rem] leading-[1.7] mb-0">
      Enter your email address and we will send you a reset link.
    </p>

    <form method="POST" class=" space-y-4">
      
      {{ form.email }}
      <div>
        <input type="email" name="email" placeholder="Email address" required
               class="email-field">
      </div>
      <button type="submit"
              class="w-full mt-4 px-4 py-3.5 rounded-xl font-bold text-white text-base
                     bg-indigo-600 hover:bg-indigo-700 transition-colors border-none cursor-pointer">
        Send Reset Link
      </button>
    </form>

    <div class="mt-4 text-center text-[.9rem]">
      <a href="{% url 'login' %}"
         class="text-indigo-600 font-semibold no-underline hover:text-indigo-700 transition-colors">
        Back to Login
      </a>
    </div>

  </div>

</body>
</html>
