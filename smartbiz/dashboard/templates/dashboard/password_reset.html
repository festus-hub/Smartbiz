<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SmartBiz</title>
    {% include 'dashboard/framework_assets.html' %}
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            padding: 1rem;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: grid;
            place-items: center;
            overflow-x: hidden;
        }

        .card {
            width: min(100%, 420px);
            background: #fff;
            padding: clamp(1.5rem, 4vw, 2.5rem);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        h2 {
            margin: 0 0 0.75rem;
            color: #111827;
            font-size: clamp(1.6rem, 4vw, 2rem);
        }

        p {
            color: #6b7280;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        input[type="email"] {
            width: 100%;
            padding: 0.9rem 1rem;
            margin-top: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            margin-top: 1rem;
            padding: 0.9rem 1rem;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
        }

        .link {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .link a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Reset Password</h2>
    <p>Enter your email address and we will send you a reset link.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.email }}

        <button type="submit">Send Reset Link</button>
    </form>

    <div class="link">
        <a href="{% url 'login' %}">Back to Login</a>
    </div>

</div>

</body>
</html>
