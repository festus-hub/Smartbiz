<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - SmartBiz</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #fff;
            padding: 40px;
            width: 400px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        h2 {
            margin-bottom: 10px;
            color: #111827;
        }

        p {
            color: #6b7280;
            font-size: 14px;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #7167db;
        }

        .link {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
        }

        .link a {
            color: #4f46e5;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Reset Password</h2>
    <p>Enter your email address and we will send you a reset link.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.email }}

        <button type="submit">Send Reset Link</button>
    </form>

    <div class="link">
        <a href="{% url 'login' %}">Back to Login</a>
    </div>

</div>

</body>
</html>
