{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Your Email - SmartBiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <script>
    tailwind = {
      config: {
        theme: { extend: { fontFamily: { sans: ["Inter","ui-sans-serif","system-ui","sans-serif"] } } }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg,#0f172a,#1e293b); }
  </style>
</head>

<body class="font-sans m-0 min-h-screen p-4 grid place-items-center overflow-x-hidden">

  <div class="w-full max-w-[420px] bg-white rounded-2xl text-center shadow-[0_20px_50px_rgba(0,0,0,.2)]"
       style="padding:clamp(1.5rem,4vw,2.5rem)">

    <div class="text-5xl text-indigo-500 mb-4 leading-none">
      <i class="bi bi-envelope-check-fill"></i>
    </div>

    <h2 class="m-0 mb-3 font-bold text-[#111827]" style="font-size:clamp(1.6rem,4vw,2rem)">
      Check your email
    </h2>

    <p class="text-[#4b5563] leading-[1.7] text-[.95rem] m-0">
      If an account exists for that email address, we have sent a password reset link.
    </p>

    <a href="{% url 'login' %}"
       class="inline-block mt-4 text-indigo-600 font-semibold no-underline hover:text-indigo-700 transition-colors">
      Back to Login
    </a>

  </div>

</body>
</html>
