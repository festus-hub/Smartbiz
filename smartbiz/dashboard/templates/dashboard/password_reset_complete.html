<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Updated - SmartBiz</title>
    {% include 'dashboard/framework_assets.html' %}
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            padding: 1rem;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: grid;
            place-items: center;
            overflow-x: hidden;
        }

        .card {
            width: min(100%, 420px);
            background: #fff;
            padding: clamp(1.5rem, 4vw, 2.5rem);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h2 {
            margin: 0 0 0.75rem;
            color: #111827;
            font-size: clamp(1.6rem, 4vw, 2rem);
        }

        p {
            color: #4b5563;
            line-height: 1.7;
            font-size: 0.95rem;
        }

        a {
            display: inline-block;
            margin-top: 1rem;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Password updated</h2>
        <p>Your password has been changed successfully. You can now sign in with your new password.</p>
        <a href="{% url 'login' %}">Go to Login</a>
    </div>
</body>
</html>
