{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - SmartBiz</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, rgb(105, 139, 133),rgb(128, 128, 128));

}

/* LAYOUT */
.container {
    display: flex;
    height: 100vh;
}

/* LEFT SIDE */
.left {
    width: 40%;
    background: linear-gradient(135deg, #efbc87, #7C3AED);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

/* RIGHT SIDE */
.right {
    width: 60%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.card {
    width: 420px;
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

/* INPUTS */
input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    outline: none;
}

input:focus {
    border-color: #4F46E5;
}

/* BUTTONS */
.btn-primary {
    width: 100%;
    padding: 12px ;
    background: #4F46E5;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    margin-top: 10px;
}

.btn-primary:hover {
    background: #0b1411;
}

.btn-secondary {
    width: 100%;
    padding: 10px ;
    background: transparent;
    color: #4F46E5;
    border: 2px solid #4F46E5;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    margin-top: 10px;
}

.btn-secondary:hover {
    background: #170216;
    color: rgb(128, 162, 220);
}

/* MESSAGES */
.message {
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 6px;
    font-size: 14px;
}

.error {
    background: #fee2e2;
    color: #b91c1c;
}

.success {
    background: #dcfce7;
    color: #166534;
}

</style>

</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left">
        <div>
            <img src="{% static 'images/logo2.png' %}" alt="smartBiz Logo" class="logo">
            <h1>SmartBiz</h1>
            <p>Create your business account</p>
        </div>
    </div>

    <!-- RIGHT -->
    <div class="right">

        <div class="card">
            
            <h2>Create Account</h2>

            <!-- DJANGO MESSAGES -->
            {% if messages %}
                {% for message in messages %}
                    <div class="message {% if message.tags %}{{ message.tags }}{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                  <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Full Name" required>
        </div>

        <div class="mb-3">
            <input type="email" name="email" class="form-control" placeholder="Email Address" required>
        </div>

        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>

        <div class="mb-3">
            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required>
        </div>

                

                <!-- CREATE ACCOUNT -->
                <button type="submit" class="btn-primary">
                    Create Account
                </button>
            </form>

            <!-- LOGIN BUTTON -->
            <a href="{% url 'login' %}">
                <button class="btn-secondary">
                    Login Instead
                </button>
            </a>

        </div>

    </div>

</div>

</body>
</html>
