{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delete Record - SmartBiz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<script>
  tailwind = {
    config: {
      theme: { extend: { fontFamily: { sans: ["Inter","ui-sans-serif","system-ui","sans-serif"] } } }
    }
  };
</script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  @keyframes fadeIn {
    from { opacity:0; transform:translateY(10px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .fade-in { animation: fadeIn .3s ease-in-out; }
</style>
</head>

<body class="font-sans bg-[#f4f6f9] flex justify-center items-center min-h-screen p-4 overflow-x-hidden m-0">

  <div class="fade-in bg-white rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,.1)]
              w-full max-w-[420px] px-[clamp(1.5rem,4vw,2rem)] py-8 text-center">

    <div class="text-[50px] text-red-500 mb-4 leading-none">
      <i class="bi bi-exclamation-triangle-fill"></i>
    </div>

    <h2 class="text-2xl font-bold text-[#333] mb-2">Delete Record</h2>

    <p class="text-[#666] text-sm mb-4">
      Are you sure you want to delete
      <span class="font-semibold text-[#111]">
        {% if customer %}{{ customer.name }}
        {% elif product %}{{ product.name }}
        {% else %}this record{% endif %}
      </span>?
    </p>

    <p class="text-[#999] text-xs mb-6">This action cannot be undone.</p>

    <form method="POST">
      {% csrf_token %}
      <div class="flex flex-col sm:flex-row gap-2.5 justify-center flex-wrap">

        <button type="submit"
                class="min-w-[120px] px-4 py-2.5 rounded-lg text-sm font-semibold text-white
                       bg-red-500 hover:bg-[#b52a37] border-none cursor-pointer transition-colors">
          Yes, Delete
        </button>

        <a href="javascript:history.back()"
           class="min-w-[120px] px-4 py-2.5 rounded-lg text-sm font-semibold text-[#333]
                  bg-[#e9ecef] hover:bg-[#d6d8db] no-underline transition-colors text-center">
          Cancel
        </a>

      </div>
    </form>

  </div>

</body>
</html>
