{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delete Customer - SmartBiz</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #f4f6f9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CARD */
.card {
    background: #fff;
    padding: 30px;
    border-radius: 14px;
    width: 420px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    text-align: center;
    animation: fadeIn 0.3s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ICON */
.icon {
    font-size: 50px;
    color: #dc3545;
    margin-bottom: 15px;
}

/* TEXT */
h2 {
    margin-bottom: 10px;
    color: #333;
}

p {
    color: #666;
    font-size: 14px;
    margin-bottom: 25px;
}

/* BUTTONS */
.btn-group {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    text-decoration: none;
    display: inline-block;
}

.btn-danger {
    background: #dc3545;
    color: white;
}

.btn-danger:hover {
    background: #b52a37;
}

.btn-secondary {
    background: #e9ecef;
    color: #333;
}

.btn-secondary:hover {
    background: #d6d8db;
}

/* NAME HIGHLIGHT */
.customer-name {
    font-weight: 600;
    color: #111;
}
</style>
</head>

<body>

<div class="card">

    <div class="icon">
        <i class="bi bi-exclamation-triangle-fill"></i>
    </div>

    <h2>Delete Customer</h2>

    <p>
        Are you sure you want to delete  
        <span class="customer-name">{{ customer.name }}</span>?
    </p>

    <p style="font-size:12px; color:#999;">
        This action cannot be undone.
    </p>

    <form method="POST">
        {% csrf_token %}

        <div class="btn-group">
            <button type="submit" class="btn btn-danger">
                Yes, Delete
            </button>

            <a href="{% url 'customers' %}" class="btn btn-secondary">
                Cancel
            </a>
        </div>
    </form>

</div>

</body>
</html>
