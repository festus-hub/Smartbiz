services:
  - type: web
    name: smartbiz-web
    rootDir: smartbiz
    runtime: python
    buildCommand: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt
      python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: python manage.py migrate --noinput && python -m gunicorn smartbiz.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: true
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: true
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartbiz-db
          property: connectionString

databases:
  - name: smartbiz-db
